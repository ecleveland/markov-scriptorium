<!-- The house seal at favicon size. The ring, the serifs and the lip of the
     full seal in src/components/Seal.tsx vanish at 16 px, so this draws only
     the wax and a heavy M. The two hexes are the oxblood and gold tokens from
     src/styles/tokens.css, repeated here because files under public/ are
     outside the stylesheets. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <circle cx="24" cy="24" r="22" fill="#8f1d2b"/>
  <path d="M13 35 V13 L24 29 L35 13 V35" fill="none" stroke="#b3925b" stroke-width="5" stroke-linejoin="miter"/>
</svg>
